name: Generate Jig Previews

on:
  push:
    paths:
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/**/*.scad'
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/lifetrac_v25_params.scad'  # every jig includes it
      - '.github/workflows/generate-jig-previews.yml'
  pull_request:
    paths:
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/**/*.scad'
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/lifetrac_v25_params.scad'  # every jig includes it
      - '.github/workflows/generate-jig-previews.yml'
  workflow_dispatch:

jobs:
  render-jigs:
    runs-on: ubuntu-latest
    name: Render Jig Preview Images
    
    # The renders are uploaded as an artifact, not committed: the root
    # .gitignore excludes *.png and *.jpg. So the job only reads the repo.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb x11-utils
          openscad --version
      
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x16 &
          XVFB_PID=$!
          echo "XVFB_PID=$XVFB_PID" >> $GITHUB_ENV
          
          # Wait for Xvfb to be ready
          for i in {1..10}; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "Xvfb is ready on display :99"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "Timeout waiting for Xvfb to start"
              exit 1
            fi
            sleep 1
          done
          
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Create output directory
        run: |
          mkdir -p LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/renders

      - name: Check the jigs for OpenSCAD warnings
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs
          
          # OpenSCAD 2021.01 exits 0 when a jig hits a warning, such as a
          # missing include or an unknown variable, and renders a blank or
          # partial image. --hardwarnings doesn't change that for PNG output.
          # So evaluate each jig first and fail on any warning or error.
          failed=0
          for scad in *.scad; do
            echo_file="${RUNNER_TEMP}/${scad%.scad}.echo"
            if ! openscad -o "${echo_file}" "${scad}"; then
              # A parse error goes only into the echo file, so print it
              cat "${echo_file}" 2>/dev/null || true
              echo "::error::OpenSCAD failed to evaluate ${scad}"
              failed=1
            elif grep -E "^(WARNING|ERROR)" "${echo_file}"; then
              echo "::error::${scad} has OpenSCAD warnings"
              failed=1
            else
              echo "✓ ${scad}"
            fi
          done
          exit ${failed}

      - name: Render the jig previews
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs
          
          # render JIG DISTANCE: an isometric and a front view of JIG.scad.
          # --camera sets the view direction, and --viewall --autocenter fit
          # the whole jig in the image. OpenSCAD also exits 0 on warnings it
          # raises while building the geometry (for example when 2D and 3D
          # objects are mixed), which the check above can't see, so fail on
          # any WARNING or ERROR line printed during the render too.
          render() {
            local jig=$1 dist=$2 view eye log
            for view in iso front; do
              if [ "${view}" = iso ]; then
                eye="${dist},${dist},${dist}"
              else
                eye="0,${dist},0"
              fi
              log="${RUNNER_TEMP}/${jig}_${view}.log"
              echo "Rendering ${jig} ${view} view..."
              if ! openscad -o "renders/${jig}_${view}.png" \
                  --camera="${eye},0,0,0" --viewall --autocenter \
                  --imgsize=800,800 --projection=p --colorscheme=Tomorrow \
                  "${jig}.scad" 2> "${log}"; then
                cat "${log}"
                echo "::error::OpenSCAD failed to render ${jig} (${view} view)"
                exit 1
              fi
              cat "${log}"
              if grep -E "^(WARNING|ERROR)" "${log}" > /dev/null; then
                echo "::error::OpenSCAD warnings while rendering ${jig} (${view} view)"
                exit 1
              fi
            done
          }

          render tube_drilling_jig 400
          render pivot_mount_welding_jig 500
          render pivot_welding_jig 300

      - name: Convert PNG to JPG (smaller file size)
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/renders
          
          # Install ImageMagick for conversion
          sudo apt-get install -y imagemagick
          
          # Convert all PNG files to JPG with good quality
          for png in *.png; do
            if [ -f "$png" ]; then
              jpg="${png%.png}.jpg"
              convert "$png" -quality 90 "$jpg"
              echo "Converted $png to $jpg"
              # Keep PNG for now, remove if JPG is preferred
              # rm "$png"
            fi
          done
          
          # List generated files
          echo "Generated render files:"
          ls -la

      - name: Upload renders as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jig-renders
          path: |
            LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/renders/*.png
            LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/renders/*.jpg
          if-no-files-found: error
          retention-days: 90
