name: Generate Jig Previews

on:
  push:
    paths:
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/**/*.scad'
      - '.github/workflows/generate-jig-previews.yml'
  pull_request:
    paths:
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/**/*.scad'
      - '.github/workflows/generate-jig-previews.yml'
  workflow_dispatch:

jobs:
  render-jigs:
    runs-on: ubuntu-latest
    name: Render Jig Preview Images
    
    # The renders are uploaded as an artifact, not committed: the root
    # .gitignore excludes *.png and *.jpg. So the job only reads the repo.
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb x11-utils
          openscad --version
      
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x16 &
          XVFB_PID=$!
          echo "XVFB_PID=$XVFB_PID" >> $GITHUB_ENV
          
          # Wait for Xvfb to be ready
          for i in {1..10}; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "Xvfb is ready on display :99"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "Timeout waiting for Xvfb to start"
              exit 1
            fi
            sleep 1
          done
          
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Create output directory
        run: |
          mkdir -p LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/renders

      - name: Check the jigs for OpenSCAD warnings
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs
          
          # OpenSCAD 2021.01 exits 0 when a jig hits a warning, such as a
          # missing include or an unknown variable, and renders a blank or
          # partial image. --hardwarnings doesn't change that for PNG output.
          # So evaluate each jig first and fail on any warning or error.
          failed=0
          for scad in *.scad; do
            echo_file="${RUNNER_TEMP}/${scad%.scad}.echo"
            if ! openscad -o "${echo_file}" "${scad}"; then
              echo "::error::OpenSCAD failed to evaluate ${scad}"
              failed=1
            elif grep -E "^(WARNING|ERROR)" "${echo_file}"; then
              echo "::error::${scad} has OpenSCAD warnings"
              failed=1
            else
              echo "✓ ${scad}"
            fi
          done
          exit ${failed}

      - name: Render Tube Drilling Jig
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs
          
          # Jig is approximately 76mm x 102mm x 178mm (3" x 4" x 7")
          # Camera distance for good framing
          CAM_DIST=400
          
          echo "Rendering tube_drilling_jig isometric view..."
          openscad -o renders/tube_drilling_jig_iso.png \
            --camera=$CAM_DIST,$CAM_DIST,$CAM_DIST,0,0,0 \
            --imgsize=800,800 \
            --projection=p \
            --colorscheme=Tomorrow \
            tube_drilling_jig.scad
          
          echo "Rendering tube_drilling_jig front view..."
          openscad -o renders/tube_drilling_jig_front.png \
            --camera=0,$CAM_DIST,0,0,0,0 \
            --imgsize=800,800 \
            --projection=p \
            --colorscheme=Tomorrow \
            tube_drilling_jig.scad

      - name: Render Pivot Mount Welding Jig
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs
          
          CAM_DIST=500
          
          echo "Rendering pivot_mount_welding_jig isometric view..."
          openscad -o renders/pivot_mount_welding_jig_iso.png \
            --camera=$CAM_DIST,$CAM_DIST,$CAM_DIST,0,0,0 \
            --imgsize=800,800 \
            --projection=p \
            --colorscheme=Tomorrow \
            pivot_mount_welding_jig.scad
          
          echo "Rendering pivot_mount_welding_jig front view..."
          openscad -o renders/pivot_mount_welding_jig_front.png \
            --camera=0,$CAM_DIST,0,0,0,0 \
            --imgsize=800,800 \
            --projection=p \
            --colorscheme=Tomorrow \
            pivot_mount_welding_jig.scad

      - name: Render Pivot Welding Jig
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs
          
          CAM_DIST=300
          
          echo "Rendering pivot_welding_jig isometric view..."
          openscad -o renders/pivot_welding_jig_iso.png \
            --camera=$CAM_DIST,$CAM_DIST,$CAM_DIST,0,0,0 \
            --imgsize=800,800 \
            --projection=p \
            --colorscheme=Tomorrow \
            pivot_welding_jig.scad
          
          echo "Rendering pivot_welding_jig front view..."
          openscad -o renders/pivot_welding_jig_front.png \
            --camera=0,$CAM_DIST,0,0,0,0 \
            --imgsize=800,800 \
            --projection=p \
            --colorscheme=Tomorrow \
            pivot_welding_jig.scad

      - name: Convert PNG to JPG (smaller file size)
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/renders
          
          # Install ImageMagick for conversion
          sudo apt-get install -y imagemagick
          
          # Convert all PNG files to JPG with good quality
          for png in *.png; do
            if [ -f "$png" ]; then
              jpg="${png%.png}.jpg"
              convert "$png" -quality 90 "$jpg"
              echo "Converted $png to $jpg"
              # Keep PNG for now, remove if JPG is preferred
              # rm "$png"
            fi
          done
          
          # List generated files
          echo "Generated render files:"
          ls -la

      - name: Upload renders as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jig-renders
          path: |
            LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/renders/*.png
            LifeTrac-v25/DESIGN-STRUCTURAL/openscad/3d_printed_welding_jigs/renders/*.jpg
          if-no-files-found: error
          retention-days: 90
