name: OpenSCAD Structural Analysis

on:
  push:
    paths:
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/**/*.scad'
      - '.github/workflows/openscad-structural-analysis.yml'
  pull_request:
    paths:
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/**/*.scad'
  workflow_dispatch:

jobs:
  structural-analysis:
    runs-on: ubuntu-latest
    name: Validate Structural Design
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb x11-utils
          openscad --version
      
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x16 &
          XVFB_PID=$!
          echo "XVFB_PID=$XVFB_PID" >> $GITHUB_ENV
          
          # Wait for Xvfb to be ready (max 10 seconds)
          for i in {1..10}; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "Xvfb is ready on display :99"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "Timeout waiting for Xvfb to start"
              exit 1
            fi
            sleep 1
          done
          
          echo "DISPLAY=:99" >> $GITHUB_ENV
      
      - name: Validate OpenSCAD syntax
        run: |
          echo "Validating OpenSCAD files..."
          cd LifeTrac-v25/DESIGN-STRUCTURAL
          
          # Check main design file
          openscad -o /dev/null --export-format echo openscad/lifetrac_v25.scad
          if [ $? -eq 0 ]; then
            echo "✓ Main design file is valid"
          else
            echo "✗ Main design file has errors"
            exit 1
          fi
          
          # Check module files (they live under openscad/ since the DESIGN-* re-layout)
          for module in openscad/modules/*.scad; do
            echo "Checking $module..."
            openscad -o /dev/null --export-format echo "$module"
            if [ $? -eq 0 ]; then
              echo "✓ $module is valid"
            else
              echo "✗ $module has errors"
              exit 1
            fi
          done
      
      - name: Run structural analysis
        id: analysis
        run: |
          echo "Running structural analysis on main design..."
          cd LifeTrac-v25/DESIGN-STRUCTURAL
          
          # Write the ECHO output to the log file. The checks themselves are in
          # openscad/analysis/structural_analysis.scad, which the main file includes.
          openscad -o structural_analysis.log --export-format echo openscad/lifetrac_v25.scad
          echo "Captured $(grep -c '^ECHO:' structural_analysis.log) ECHO lines"
          if ! grep -q '^ECHO: "STRUCTURAL ANALYSIS SUMMARY"$' structural_analysis.log; then
            echo "::error::No structural analysis summary in the OpenSCAD output"
            exit 1
          fi

          # The summary and detail blocks are Markdown; strip the ECHO wrapper once for
          # the report, the persistent log and the pass/fail step
          sed -n '/^ECHO: "STRUCTURAL ANALYSIS SUMMARY"$/,/^ECHO: "OVERALL: /p' structural_analysis.log \
            | tail -n +2 | sed 's/^ECHO: "//; s/"$//' > structural_summary.md
          sed -n '/^ECHO: "STRUCTURAL ANALYSIS DETAIL"$/,/^ECHO: "STRUCTURAL ANALYSIS SUMMARY"$/p' structural_analysis.log \
            | sed '1d;$d' | sed 's/^ECHO: "//; s/"$//' > structural_detail.md
          cat structural_summary.md

      - name: Generate structural analysis report
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL

          echo "# Structural Analysis Report" > structural_report.md
          echo "" >> structural_report.md
          echo "**Generated:** $(date)" >> structural_report.md
          echo "**Commit:** ${{ github.sha }}" >> structural_report.md
          echo "**Branch:** ${{ github.ref_name }}" >> structural_report.md
          echo "" >> structural_report.md
          echo "## Structural Analysis Results" >> structural_report.md
          echo "" >> structural_report.md
          cat structural_summary.md >> structural_report.md

          cat structural_report.md
      
      - name: Create persistent structural analysis log
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL
          
          # Create or update the persistent log file
          echo "# Structural Analysis Test Log" > STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "This file tracks the history of structural analysis test results." >> STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "---" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "## Latest Analysis" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "**Commit:** ${{ github.sha }}" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "**Branch:** ${{ github.ref_name }}" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "**Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "### Summary" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md
          cat structural_summary.md >> STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "### Detail" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md
          cat structural_detail.md >> STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md

          echo "---" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "" >> STRUCTURAL_ANALYSIS_LOG.md
          echo "_This file is automatically updated by the OpenSCAD Structural Analysis workflow._" >> STRUCTURAL_ANALYSIS_LOG.md
          
          cat STRUCTURAL_ANALYSIS_LOG.md

      # Runs before the log is committed, so a new failure fails the pushed commit itself
      # instead of being committed as a [skip ci] log update. The steps after it that
      # must still run on a failure are marked !cancelled().
      - name: Fail on new structural failures
        id: gate
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL
          if grep -q "remove from STRUCT_KNOWN_ISSUES" structural_summary.md; then
            echo "::warning::A check listed in STRUCT_KNOWN_ISSUES now passes. Remove it from the list in openscad/analysis/structural_analysis.scad."
          fi
          if grep -q "NEW FAIL" structural_summary.md; then
            echo "::error::A structural check fails that isn't listed as a known issue:"
            grep "NEW FAIL" structural_summary.md
            exit 1
          fi
          echo "No new structural failures"

      - name: Commit structural analysis log
        run: |
          cd LifeTrac-v25/DESIGN-STRUCTURAL
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add the log file
          git add STRUCTURAL_ANALYSIS_LOG.md
          
          # Check if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "Update structural analysis log [skip ci]"
            git push --force-with-lease origin HEAD || {
              echo "INFO: git push failed. This is expected on PRs from forks."
              echo "The log file is available as a workflow artifact."
            }
          else
            echo "No changes to structural analysis log"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload structural analysis artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: structural-analysis
          path: |
            LifeTrac-v25/DESIGN-STRUCTURAL/structural_analysis.log
            LifeTrac-v25/DESIGN-STRUCTURAL/structural_report.md
            LifeTrac-v25/DESIGN-STRUCTURAL/STRUCTURAL_ANALYSIS_LOG.md
          retention-days: 90
      
      - name: Cleanup Xvfb
        if: always()
        run: |
          if [ -n "$XVFB_PID" ]; then
            echo "Stopping Xvfb process (PID: $XVFB_PID)"
            # Try graceful shutdown first
            kill -TERM $XVFB_PID 2>/dev/null || true
            # Wait up to 5 seconds for process to terminate
            for i in {1..5}; do
              if ! kill -0 $XVFB_PID 2>/dev/null; then
                echo "Xvfb stopped gracefully"
                break
              fi
              sleep 1
            done
            # Force kill if still running
            kill -KILL $XVFB_PID 2>/dev/null || true
            echo "Xvfb force stopped"
          fi
      
      - name: Comment on PR with structural analysis
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.analysis.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const status = {
              success: '✅ No new structural failures.',
              failure: "❌ A check fails that isn't listed in `STRUCT_KNOWN_ISSUES`; see the table.",
            }[process.env.GATE_OUTCOME] || "⚠️ The pass/fail step didn't run; see the workflow run.";

            // Read the structural report
            let reportContent = 'Structural analysis completed. Check artifacts for detailed results.';
            try {
              const report = fs.readFileSync('LifeTrac-v25/DESIGN-STRUCTURAL/structural_report.md', 'utf8');
              // Extract just the results section
              const match = report.match(/## Structural Analysis Results[\s\S]*$/);
              if (match) {
                reportContent = match[0];
              }
            } catch (err) {
              console.log('Could not read structural report:', err);
            }
            
            const comment = `## OpenSCAD Structural Analysis Results 🔧
            
            ${status}

            ${reportContent}

            ### Persistent Log
            The summary and the detail tables also go to \`LifeTrac-v25/DESIGN-STRUCTURAL/STRUCTURAL_ANALYSIS_LOG.md\`. A run triggered by a push commits that file when no new check fails.

            ### Artifacts
            Download the detailed analysis from the workflow artifacts:
            - \`structural-analysis\` - Complete logs and report
            
            **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
