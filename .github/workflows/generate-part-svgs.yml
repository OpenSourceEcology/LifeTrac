name: Generate Individual Part SVGs

on:
  push:
    branches: [ main, master ]
    paths: 
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/parts/*.scad'
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/lifetrac_v25_params.scad'
      - '.github/workflows/generate-part-svgs.yml'
  pull_request:
    branches: [ main, master ]
    paths: 
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/parts/*.scad'
      - 'LifeTrac-v25/DESIGN-STRUCTURAL/openscad/lifetrac_v25_params.scad'
      - '.github/workflows/generate-part-svgs.yml'
  workflow_dispatch:

jobs:
  generate-svgs:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref_name }}
    
    - name: Install OpenSCAD
      run: |
        sudo apt-get update
        sudo apt-get install -y openscad xvfb
    
    - name: Generate Individual Part SVGs
      run: |
        cd LifeTrac-v25/DESIGN-STRUCTURAL
        mkdir -p output/svg/parts
        
        echo "========================================="
        echo "Generating Individual Part SVG Cutouts"
        echo "========================================="
        
        # Function to export a part
        failed=0
        export_part() {
          local name=$1
          local scad=$2
          local svg=$3
          echo "Exporting ${name}..."
          xvfb-run -a openscad --render --export-format=svg -o "${svg}" "${scad}" 2>&1 | grep -v "WARNING" || true
          if [ -s "${svg}" ]; then
            echo "  ✓ ${name} exported"
            ls -lh "${svg}"
          else
            echo "::error::Failed to export ${name} (${scad})"
            failed=1
          fi
        }
        
        # Export all parts
        export_part "Side Panel Outer" \
          "openscad/parts/export_side_panel_outer.scad" \
          "output/svg/parts/side_panel_outer.svg"
        
        export_part "Side Panel Inner" \
          "openscad/parts/export_side_panel_inner.scad" \
          "output/svg/parts/side_panel_inner.svg"
        
        export_part "Wheel Mount" \
          "openscad/parts/export_wheel_mount.scad" \
          "output/svg/parts/wheel_mount.svg"
        
        export_part "Cylinder Lug" \
          "openscad/parts/export_cylinder_lug.scad" \
          "output/svg/parts/cylinder_lug.svg"
        
        export_part "Rear Crossmember" \
          "openscad/parts/export_rear_crossmember.scad" \
          "output/svg/parts/rear_crossmember.svg"
        
        export_part "Standing Deck" \
          "openscad/parts/export_standing_deck.scad" \
          "output/svg/parts/standing_deck.svg"
        
        export_part "Bucket Bottom" \
          "openscad/parts/export_bucket_bottom.scad" \
          "output/svg/parts/bucket_bottom.svg"
        
        export_part "Bucket Side" \
          "openscad/parts/export_bucket_side.scad" \
          "output/svg/parts/bucket_side.svg"
        
        echo "========================================="
        echo "Export Complete!"
        echo "========================================="
        ls -lh output/svg/parts/
        if [ "$failed" -ne 0 ]; then
          exit 1
        fi
    
    # output/ is git-ignored, so the SVGs are only available as an artifact
    - name: Upload part SVGs
      uses: actions/upload-artifact@v4
      with:
        name: part-svgs
        path: LifeTrac-v25/DESIGN-STRUCTURAL/output/svg/parts/
        if-no-files-found: error
        retention-days: 90
