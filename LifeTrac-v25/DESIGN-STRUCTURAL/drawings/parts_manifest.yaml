# LifeTrac v25 - part drawing manifest
# =============================================================================
# One entry per UNIQUE part.  generate_part_drawings.py renders each entry with
# OpenSCAD and draws a PDF sheet for it.  See README.md for the full field list.
#
#   id        part number printed on the drawing and used in assembly steps
#   name      title on the drawing
#   category  plate | angle | tube | bar | lug | ring | printed | fastener
#   source    .scad file (relative to DESIGN-STRUCTURAL/) that defines the part
#   call      OpenSCAD statement that draws exactly ONE part (the file is
#             `use`d, so only its modules are visible; the params file is
#             `include`d, so parameters such as PLATE_1_2_INCH can be used)
#   clip_box  [[x0,y0,z0],[x1,y1,z1]] keep only this box of the call's output
#             (for modules that draw a part together with its neighbours)
#   count     BOM_PART marker key(s) counted in the assembly -> QTY PER MACHINE
#   qty       hand-entered quantity; used when there is no marker, otherwise
#             only cross-checked against the model count (see generated/CHECKS.md)
#   rotate    [[axis, degrees], ...] turn the part after auto-orientation
#   options   per-part drawing options (see categories below)
# =============================================================================

project: LIFETRAC v25 - OPEN SOURCE ECOLOGY
assembly: openscad/lifetrac_v25.scad        # evaluated to count BOM_PART markers
params: openscad/lifetrac_v25_params.scad   # included in every wrapper

# BOM_PART markers that are modelled but intentionally have no drawing.  Listed
# in generated/CHECKS.md; anything else unregistered is reported as a warning.
ignore_markers:
  "NUT 22.86": Hydraulic cylinder base-pin nuts - hardware supplied with the cylinders (modelled size is not a standard nut)
  "NUT 18.288": Hydraulic cylinder rod-pin nuts - hardware supplied with the cylinders (modelled size is not a standard nut)

# New parts are drawn before anyone writes their entry below.  A BOM_PART
# marker that no entry claims is drawn automatically when its key is a part
# number whose letter prefix is listed here (A11 -> angle), exactly one module
# under openscad/ echoes it, and that module draws just this one part with its
# default arguments.  The sheet then has a placeholder name and stock, and
# generated/CHECKS.md shows an entry to paste in here.
auto_categories: {P: plate, A: angle, T: tube, R: bar, U: lug, F: fastener}

defaults:
  notes:
    - DIMENSIONS IN MILLIMETRES [INCHES]. DO NOT SCALE DRAWING.
    - GENERATED FROM THE OPENSCAD MODEL. IF THIS SHEET AND THE MODEL DISAGREE, THE MODEL GOVERNS. THE GEOMETRY ID IDENTIFIES THE MODEL VERSION.

categories:
  plate:
    label: CNC-cut plate
    process: CNC PLASMA CUT
    finish: REMOVE DROSS, DEBURR; PRIME + PAINT
    density: 7.85
    options: {hidden_lines: false, thickness: true, dxf: true, views: [front, top, iso]}
    notes:
      - "CUT THE PROFILE FROM generated/dxf/{dxf} AT 1:1. THIS SHEET IS FOR INSPECTION AND HOLE CHECKING."
      - "TOLERANCES: PROFILE AND HOLE POSITION ±0.8 [±.03]; HOLE Ø +0.5/-0 [+.02/-0]."
      - "HOLES MARKED DRILL* ARE SMALLER THAN THE PLATE THICKNESS: PLASMA-MARK THE CENTRE ONLY, THEN DRILL TO SIZE."
      - EDGES SQUARE UNLESS NOTED. BREAK SHARP EDGES. MARK THE PART NUMBER ON EACH PIECE.
  angle:
    label: Angle iron (cut and drill)
    process: SAW CUT + DRILL
    finish: DEBURR; PRIME + PAINT
    density: 7.85
    options: {hidden_lines: true, running_dims: true}
    notes:
      - "SQUARE CUT BOTH ENDS. CUT LENGTH ±1.5 [±1/16]."
      - "HOLE POSITION ±0.8 [±1/32]. RUNNING DIMENSIONS ARE MEASURED FROM THE LEFT END (0) AS DRAWN."
      - DEBURR HOLES AND CUT ENDS. MARK THE PART NUMBER ON EACH PIECE WITH A PAINT PEN.
  tube:
    label: Rectangular / square tube (cut and drill)
    process: SAW CUT + DRILL
    finish: DEBURR; PRIME + PAINT
    density: 7.85
    options: {hidden_lines: true, running_dims: true}
    notes:
      - "SQUARE CUT BOTH ENDS UNLESS SHOWN. CUT LENGTH ±1.5 [±1/16]."
      - "HOLE POSITION ±0.8 [±1/32]. RUNNING DIMENSIONS ARE MEASURED FROM THE LEFT END (0) AS DRAWN."
      - "'THRU 2X WALLS' = DRILL THROUGH BOTH WALLS ON ONE AXIS (DRILL PRESS OR JIG)."
      - DEBURR HOLES AND CUT ENDS. MARK THE PART NUMBER ON EACH PIECE WITH A PAINT PEN.
  bar:
    label: Round bar and pins (cut and drill)
    process: SAW CUT + DRILL (LATHE FACE IF AVAILABLE)
    finish: DEBURR; GREASE AT ASSEMBLY
    density: 7.85
    options: {hidden_lines: true, running_dims: true, views: [front, top, right, iso]}
    notes:
      - "CUT LENGTH ±0.8 [±1/32]. FACE BOTH ENDS SQUARE, BREAK EDGES."
      - CROSS HOLES SQUARE TO THE AXIS AND THROUGH THE CENTRE LINE.
  lug:
    label: Lugs and brackets cut from tube
    process: SAW CUT + TORCH/PLASMA TRIM + DRILL
    finish: DEBURR; PRIME + PAINT
    density: 7.85
    options: {hidden_lines: true}
    notes:
      - "OVERALL SIZE ±1.5 [±1/16]. PIVOT HOLE POSITION ±0.5 [±.02]; DRILL PIVOT HOLES THROUGH BOTH WALLS IN ONE PASS."
      - DEBURR ALL EDGES. MARK THE PART NUMBER ON EACH PIECE.
  ring:
    label: Rings and bosses (CNC-cut plate)
    process: CNC PLASMA CUT, BORE DRILLED/REAMED
    finish: REMOVE DROSS, DEBURR
    density: 7.85
    options: {hidden_lines: false, thickness: true, dxf: true}
    notes:
      - "CUT THE PROFILE FROM generated/dxf/{dxf} AT 1:1 WITH THE BORE UNDERSIZE, THEN DRILL/REAM THE BORE TO THE SIZE SHOWN."
      - "OD ±0.8 [±.03]. BORE Ø +0.2/-0 [+.008/-0]."
  printed:
    label: 3D-printed jigs
    process: FFF 3D PRINT
    finish: AS PRINTED
    density: 1.24
    options: {hidden_lines: true, views: [front, top, right, iso]}
    notes:
      - "PRINT FROM THE SOURCE .SCAD (EXPORT STL). PLA OR PETG, 0.2 LAYER, 3+ PERIMETERS, 20-30% INFILL, SUPPORTS AS NEEDED."
      - "TOLERANCE ±0.3 [±.012]. FIT-CRITICAL FEATURES: TEST-FIT ON THE REAL STOCK AND SCALE THE MODEL IF NEEDED."
  fastener:
    label: Purchased hardware (reference)
    process: PURCHASED - DO NOT FABRICATE
    finish: ZINC PLATED
    density: 7.85
    options: {hidden_lines: true, hole_table: false, views: [front, right, iso]}
    notes:
      - "PURCHASED PART - REFERENCE ONLY. BUY TO THE DESIGNATION IN MATERIAL / STOCK; SHAPE AND SIZE SHOWN ARE NOMINAL (ASME B18.2.1 / B18.2.2 / SAE WASHER)."
      - "THREADS SHOWN SIMPLIFIED (ASME Y14.6)."

