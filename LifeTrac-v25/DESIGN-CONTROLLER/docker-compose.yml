# LifeTrac v25 base-station compose stack.
#
# Brings up: mosquitto broker, lora_bridge (talks to the SX1276 over USB-CDC),
# web_ui (operator console + REST), audit-tail (rotating JSONL writer).
#
# All four services share the same image (built from ./Dockerfile) and the
# same /var/lib/lifetrac volume so audit logs and settings survive restarts.
# Mosquitto is on the default 1883 inside the compose network so containers
# can talk to it as `mqtt://mosquitto:1883` without exposing it to the LAN.
#
# Run with:
#     docker compose up -d
# Tail a service:
#     docker compose logs -f web_ui
# Bring down (preserving volumes):
#     docker compose down

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./base_station/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    # Bound to localhost only; reverse-proxy TLS or a firewall handles LAN
    # exposure. Compose-internal traffic uses the service-name DNS alias.
    ports:
      - "127.0.0.1:1883:1883"
    # L1 healthchecks (TODO.md PWR-3, 2026-10-17) REPORT STATUS ONLY. Docker
    # never restarts a container for being "unhealthy"; acting on the status
    # is lifetrac-supervisor's job (firmware/x8_recovery/, L3), and only for
    # containers on its allowlist. No start_interval anywhere: it needs Docker
    # 25.0 and the boards run 24.0.2 (base) / 20.10.14 (tractor).
    # Exec form, no shell, so the probe needs nothing from the image but
    # mosquitto_sub. It reads the retained $SYS/broker/version from host
    # `mosquitto`, the name the siblings use (mqtt://mosquitto:1883). Docker's
    # embedded DNS resolves that alias (seen on the board: bench-evidence/
    # board_state_2026-10-04/base/61_inspect_design-controller-mosquitto-1.json)
    # to this container's compose-network address, never 127.0.0.1, so a
    # loopback-only listener (the eclipse-mosquitto:2 default) fails it.
    # `$$` is compose's escape for one `$`. Needs the $SYS tree on (no
    # `sys_interval 0` in base_station/mosquitto.conf). Docker counts any
    # non-zero exit as a failed probe. Cost: each probe is a connect and a
    # disconnect in the broker's notice log (client id lifetrac-healthcheck),
    # 2880 probes a day, into journald on the base.
    # VERIFY (PWR-3): not yet run on a board. Before anyone allowlists this
    # broker, `docker inspect -f '{{json .State.Health}}'
    # design-controller-mosquitto-1` must read healthy, with the version in
    # its probe log.
    # Keep this broker OFF that allowlist too, for now, like the tractor's:
    # audit_tail (audit_log.py --tail-mqtt) and lora_bridge (cmd/estop
    # included) subscribe once after connect(), with paho's default clean
    # session and no on_connect. After a broker restart paho reconnects them
    # with no subscriptions, so the audit trail and the bridge's E-stop
    # forwarding stop and nothing logs it. Only web_ui resubscribes
    # (_on_mqtt_connect in web_ui.py). Allowlist the broker once those two
    # resubscribe in on_connect, or are gone (lora_bridge: RS-5.11).
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "mosquitto", "-p", "1883",
             "-i", "lifetrac-healthcheck", "-t", "$$SYS/broker/version",
             "-C", "1", "-W", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  lora_bridge:
    build: .
    image: lifetrac-v25:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    # Bridge needs the SX1276 USB-CDC; map the host device through. The
    # path is overridable via .env so dev boxes can swap in a virtual
    # serial port for tests.
    devices:
      - "${LIFETRAC_LORA_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0"
    environment:
      LIFETRAC_MQTT_HOST: mosquitto
      LIFETRAC_LORA_DEVICE: /dev/ttyACM0
      LIFETRAC_FLEET_KEY_FILE: /run/secrets/lifetrac_fleet_key
      LIFETRAC_NONCE_STORE: /var/lib/lifetrac/nonce_store.json
    volumes:
      - lifetrac_state:/var/lib/lifetrac
      - lifetrac_logs:/var/log/lifetrac
    secrets:
      - lifetrac_fleet_key
    # Bridge takes the LoRa device as its single positional arg; the env var
    # is the only source of truth so .env / compose stay in sync (IP-002).
    command: ["sh", "-c", "exec python /app/base_station/lora_bridge.py \"$LIFETRAC_LORA_DEVICE\" --mqtt \"$LIFETRAC_MQTT_HOST\""]

  web_ui:
    build: .
    image: lifetrac-v25:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      LIFETRAC_MQTT_HOST: mosquitto
      LIFETRAC_PIN_FILE: /run/secrets/lifetrac_pin
      LIFETRAC_PIN: "${LIFETRAC_PIN:-}"
      LIFETRAC_SETTINGS_PATH: /var/lib/lifetrac/settings.json
      LIFETRAC_TRUSTED_PROXIES: "${LIFETRAC_TRUSTED_PROXIES:-}"
    volumes:
      - lifetrac_state:/var/lib/lifetrac
      - lifetrac_logs:/var/log/lifetrac
    ports:
      - "8080:8080"
    secrets:
      - lifetrac_pin
    command: ["uvicorn", "web_ui:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers"]
    # Status only, like mosquitto's (PWR-3). web_ui must NOT go on
    # lifetrac-supervisor's restart allowlist: a restart republishes the saved
    # encode mode and a pinned radio profile, retained, at module import
    # (web_ui.py module-level startup republish; TODO.md RS-0.6 class).
    # web_ui.py has no /healthz; GET /api/session is unauthenticated, always
    # 200 and runs on the event loop, so a wedged loop fails it. The image has
    # no curl/wget, hence python; ProxyHandler({}) stops an inherited
    # http_proxy from routing the probe. start_period 60s: the module import
    # blocks up to 30 s on the broker connect (IP-201 retry loop in web_ui.py)
    # before uvicorn binds :8080, plus import time on the X8's A53 cores.
    # Cost: uvicorn's access log is on (no --no-access-log, nothing in
    # web_ui.py quiets uvicorn.access), so each probe is one
    # `GET /api/session` line from 127.0.0.1: 2880 a day in `docker logs` and
    # journald, among the operator's requests. Accepted for now; muting it
    # wants a filter in web_ui.py, not --no-access-log, which would also drop
    # the operator's access trail.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request as u;
          r = u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8080/api/session', timeout=5);
          sys.exit(0 if r.status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  audit_tail:
    build: .
    image: lifetrac-v25:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      LIFETRAC_MQTT_HOST: mosquitto
      LIFETRAC_AUDIT_PATH: /var/log/lifetrac/audit.jsonl
    volumes:
      - lifetrac_logs:/var/log/lifetrac
    command: ["python", "-m", "audit_log", "--tail-mqtt"]

volumes:
  mosquitto_data:
  mosquitto_logs:
  lifetrac_state:
  lifetrac_logs:

# Docker secrets — populate ./secrets/{lifetrac_pin,lifetrac_fleet_key} on the
# base station before `docker compose up`. Files are mounted read-only at
# /run/secrets/* and consumed via the *_FILE env vars above (IP-002, IP-008).
secrets:
  lifetrac_pin:
    file: ./secrets/lifetrac_pin
  lifetrac_fleet_key:
    file: ./secrets/lifetrac_fleet_key
