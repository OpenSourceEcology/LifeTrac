<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    LifeTrac v25 — PWA app icon.
    Dark background (#1a1d22) with green accent (#4caf50) to match the
    operator-console colour palette.  Used for both the 192 × 192 and
    512 × 512 manifest entries (purpose = "any maskable").
    The safe zone for maskable icons is 80 % of the canvas, so all
    content is kept inside the inner 410 × 410 area.
  -->
  <!-- background — fills the full canvas (required for maskable) -->
  <rect width="512" height="512" fill="#1a1d22"/>
  <!-- tractor-track silhouette — two wheels connected by an under-track -->
  <!-- rear large wheel -->
  <circle cx="168" cy="316" r="98" fill="none" stroke="#4caf50" stroke-width="30"/>
  <!-- rear wheel hub -->
  <circle cx="168" cy="316" r="22" fill="#4caf50"/>
  <!-- front small wheel -->
  <circle cx="356" cy="316" r="62" fill="none" stroke="#4caf50" stroke-width="30"/>
  <!-- front wheel hub -->
  <circle cx="356" cy="316" r="16" fill="#4caf50"/>
  <!-- under-track belt (bottom arc connecting the two wheels) -->
  <path d="M168 414 Q262 440 356 378" fill="none" stroke="#4caf50" stroke-width="30" stroke-linecap="round"/>
  <!-- tractor body / chassis rail above wheels -->
  <rect x="150" y="218" width="220" height="44" rx="12" fill="#4caf50"/>
  <!-- cab (operator cabin) -->
  <rect x="290" y="140" width="106" height="90" rx="14" fill="#4caf50"/>
  <!-- cab window cutout -->
  <rect x="304" y="154" width="78" height="56" rx="8" fill="#1a1d22"/>
</svg>
