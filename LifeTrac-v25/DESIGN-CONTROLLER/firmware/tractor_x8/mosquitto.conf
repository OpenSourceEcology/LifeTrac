# LifeTrac v25 tractor X8 mosquitto config, for the production compose
# (docker-compose.yml in this directory, bound read-only at
# /mosquitto/config/mosquitto.conf).
#
# 2026-10-17 (TODO.md PWR-3). Before this file nothing in the repo
# configured the broker, so a fresh install ran the eclipse-mosquitto:2
# default config. That has no listener line, so mosquitto 2.x starts in
# local-only mode (loopback only) and would refuse the camera container,
# which connects over the compose network as mqtt://mosquitto:1883.
# mosquitto.video-test.conf fixed the same thing for the bench stack.
# INFERRED from the image default, not seen on the bench tractor: its config
# volume was never captured, and its 2026-07-25 camera crash inside
# _build_frame, after connect(), suggests that broker took the camera anyway.
# VERIFY before citing the old behaviour. Read the DEPLOY CAUTION in
# docker-compose.yml before installing this on a bench tractor.
#
# Anonymous listener on 1883 on every container interface; no auth, no TLS.
# Container network only: the compose file publishes no port, so nothing off
# the X8 can reach it. The compose healthcheck connects to host `mosquitto`,
# which Docker resolves to the container's network address, so a listener
# bound to 127.0.0.1 would turn the broker "unhealthy". That probe has not
# run on a board yet (VERIFY, PWR-3).
listener 1883 0.0.0.0
allow_anonymous true

# Persistence stays off, as it was under the image default. Turning it on
# would replay pre-reboot retained topics (encode_mode_override,
# tractor/link_budget) into a freshly booted camera_service: a behaviour
# change that needs its own decision (retained-pin incident class, TODO.md
# RS-0.6), not a side effect of a listener fix. The mosquitto_data volume
# stays mounted so that decision needs no compose change.
persistence false

# The compose healthcheck reads the retained $SYS/broker/version, so the $SYS
# tree must stay on: do not set `sys_interval 0`.

# stdout goes to docker's log driver (journald on LmP), so
# `docker logs tractor-mosquitto` and journalctl show the broker log. Notice
# level includes client connects and disconnects: the healthcheck adds one
# connect/disconnect pair, client id lifetrac-healthcheck, every 30 s.
log_dest stdout
log_type error
log_type warning
log_type notice
