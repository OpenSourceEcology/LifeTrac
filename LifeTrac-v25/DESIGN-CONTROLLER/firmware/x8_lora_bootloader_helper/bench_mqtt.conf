# RS-5.9 (2026-07-25): bench-only mosquitto config for the tractor-local
# frame feed. Mounted over /mosquitto/config/mosquitto.conf in the
# bench_mqtt container (--network=host), so the listener below binds the
# TRACTOR host netns loopback — reachable by tx_smoke and synth_pub
# (both --network=host), unreachable from any LAN. Replaces the legacy
# host-broker feed that needed tractor WiFi (disabled per MASTER_PLAN
# §8.13).
listener 1883 127.0.0.1
allow_anonymous true
