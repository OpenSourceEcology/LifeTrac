# 09_resume_h7.cfg — restart the H7 after 08_boot_user_app.cfg left it halted.
# A halted H7 parks its GPIOs; the L072's host-UART RX net shares pins with
# the H7 (PA9/PA10 mirror), so a halted H7 can jam X8->L072 traffic.
init
echo "resetting H7 into normal run..."
reset run
echo "H7 released."
shutdown
