# 90-lifetrac-timeout.conf -- bound a hung reboot at 3 min instead of 30.
# Part of L2 in X8_HEALTH_AND_RECOVERY/REBOOT_AND_POWER_CYCLE.md (TODO.md PWR-2).
#
# Installed to /etc/systemd/system/reboot.target.d/ by ../../install_watchdog.sh,
# together with ../system.conf.d/90-lifetrac-watchdog.conf. Takes effect at
# PID 1's next reload, whoever causes it (`systemctl daemon-reload` or
# daemon-reexec, or any `systemctl enable`, `disable`, `mask`, `unmask`,
# `preset`, `revert` or `edit` run without --no-reload), or the next boot.
#
# Why (2026-10-17): upstream reboot.target ships JobTimeoutSec=30min with
# JobTimeoutAction=reboot-force. The job timer runs from the moment
# `systemctl reboot` queues reboot.target. While units are being stopped PID 1
# is healthy and keeps petting WDOG1, so RuntimeWatchdogSec never fires, and
# RebootWatchdogSec only starts once systemd-shutdown runs. A process stuck in
# D state on a wedged USB/camera device (uvcvideo, the C2 behind the ci_hdrc
# host controller) survives SIGKILL; each unit waiting on one costs its
# TimeoutStopSec plus the final-SIGKILL wait, and units ordered after it queue
# behind it. That can hold a supervisor-requested reboot (L3) for the full
# 30 min. 3 min should cover a normal shutdown on both boards (docker stops
# every container, 10 s grace each) with margin -- estimated, not yet timed;
# after it, reboot-force skips the remaining unit stops and systemd-shutdown
# takes over, bounded by RebootWatchdogSec=2min. Worst case to a restart:
# 3 + 2 min, plus up to 128 s if the kernel itself hangs in device shutdown
# (imx2_wdt re-arms at its max).
# Cost -- OTA: both boards run ostree-finalize-staged (.path enabled in
# bench-evidence/board_state_2026-10-04/base and 2026-10-10/tractor
# 10_systemd.txt). It applies a staged deployment in its ExecStop, stopped
# last (Before=basic.target), and upstream gives it TimeoutStopSec=5m because
# "the failure mode here is that people don't get an upgrade". One D-state
# unit uses the whole 3 min (90 s TimeoutStopSec + 90 s after the final
# SIGKILL), so a reboot with a staged OTA AND a wedged device would skip or
# kill the finalize: the update is silently not applied and the old
# deployment boots (inferred from the units and systemd 250's job timer,
# which starts at queue time). VERIFY under PWR-1 with a staged deployment,
# and time a normal shutdown on each board, before arming L2 where OTAs run.
# JobTimeoutAction restates the upstream value on purpose, so the bound and
# its action read together here.
[Unit]
JobTimeoutSec=3min
JobTimeoutAction=reboot-force
