# 90-lifetrac-watchdog.conf -- L2 of X8_HEALTH_AND_RECOVERY/REBOOT_AND_POWER_CYCLE.md
# (TODO.md PWR-2): systemd (PID 1) owns the i.MX WDOG1 hardware watchdog.
#
# Installed to /etc/systemd/system.conf.d/ by ../../install_watchdog.sh, never by
# hand. It takes effect at the next `systemctl daemon-reload` or daemon-reexec,
# whoever runs it (systemd 250 re-reads system.conf.d on every reload; any other
# installer's daemon-reload arms it), or at the next boot. Installing it is
# arming it; after removal the next reload disarms it with a 'V' close.
#
# What it does (2026-10-17):
#   u-boot arms WDOG1 at 60 s with WDOG_B -> BD71847 PMIC, so a timeout is a full
#   PMIC power cycle of the module (WRSR then reads POR, never TOUT). Until now the
#   kernel's boot keepalive petted it forever, so a hung PID 1 or a frozen
#   userspace never tripped it.
#   RuntimeWatchdogSec=30s: PID 1 opens /dev/watchdog0, sets the hardware timeout
#   to 30 s (WCR WT=59, about 0x3b3d -- inferred; read it with
#   x8_lora_bootloader_helper/bench_tools/wdog_regs.py) and pets it about every
#   15 s from its main loop. If PID 1 or the kernel stops scheduling, the PMIC
#   power-cycles the module about 30 s later. While systemd holds the
#   single-open device, everyone else
#   (wdt_pet.sh included) gets EBUSY; wdt_pet.sh then relies on systemd and
#   starts no petter.
#   RebootWatchdogSec=2min: covers ONLY the systemd-shutdown phase (after PID 1
#   has stopped the units and exec'd systemd-shutdown: final kill, unmount,
#   detach). At device shutdown the imx2_wdt driver re-arms the hardware to its
#   128 s maximum, so the last stretch into the kernel restart is bounded by
#   that, not by this value. A shutdown that hangs while units are still being
#   stopped is bounded by the reboot.target drop-in installed with this one
#   (systemd/reboot.target.d/90-lifetrac-timeout.conf) instead.
#   Both values stay at or under imx2_wdt's 128 s hardware maximum.
#   The 90- prefix sorts after, and so overrides, a vendor 10-watchdog.conf in
#   /usr/lib/systemd/system.conf.d (later drop-ins win, key by key).
#
# BENCH: opt-in only (`install --role bench --bench-opt-in`). Any unattended
#   reboot on the bench wipes the /tmp staging (/tmp/lifetrac_p0c,
#   /tmp/lifetrac_strict) and re-triggers the tractor's lifetrac-camera.service,
#   which grabs /dev/ttymxc3 (the L072 UART) until it is stopped again.
# TRACTOR: do NOT arm it until the TODO.md PWR prerequisites land: PWR-8, no
#   per-boot H747 bank-1 erase/reflash by stm32h7-program.service (X8OS-3);
#   PWR-9, H747 nonce seeds from its RNG (H7-13); and PWR-11, the Opta latch
#   semantics after an H747 reset settled. Today every reboot, a watchdog power
#   cycle included, reflashes the H747 and resets it; in production that trips
#   the engine-kill latch through the Opta.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
